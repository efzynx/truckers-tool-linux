name: Desktop Build
on:
  push:
    tags:
      - 'v*' # Trigger otomatis hanya ketika ada rilis tag v1.0.1+
    branches:
      - main
      - beta

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
          NEXT_PUBLIC_CLIENT_API_KEY: ${{ secrets.NEXT_PUBLIC_CLIENT_API_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://your-vercel-domain.vercel.app/api/v1' }}
        run: npm run dist -- --publish always
