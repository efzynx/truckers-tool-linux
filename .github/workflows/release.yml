name: Auto Release

on:
  push:
    branches: [main, beta, alpha, rc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check_tag.outputs.exists }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npx tsc --noEmit || true

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if pre-release (contains dash, e.g. 0.1.2-1, 0.2.0-beta.1)
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Pre-release detected: v$VERSION"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Stable release: v$VERSION"
          fi

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️ Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Tag $TAG does not exist, creating release."
          fi

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Generate release notes
        if: steps.check_tag.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"

          BRANCH="${GITHUB_REF#refs/heads/}"

          if [ "$BRANCH" = "alpha" ]; then
            TITLE="🔬 v${VERSION} — Alpha"
          elif [ "$BRANCH" = "rc" ]; then
            TITLE="🚦 v${VERSION} — Release Candidate"
          elif [ "$PRERELEASE" = "true" ]; then
            TITLE="🧪 v${VERSION} — Pre-release (Beta)"
          else
            TITLE="🚛 v${VERSION}"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          
          # Extract the latest changelog block
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(awk '/^## \[/ { if (p) exit; p=1; print; next } p { print }' CHANGELOG.md)
          else
            CHANGELOG="See commit history for changes."
          fi

          {
            echo "body<<EOF"
            if [ "$PRERELEASE" = "true" ]; then
              echo -e "⚠️ **This is a pre-release version for testing purposes.**\n"
              echo -e "Install with:\n\`\`\`bash\n./ttl.sh update --beta\n\`\`\`\n"
              echo -e "To go back to stable:\n\`\`\`bash\n./ttl.sh update\n\`\`\`\n\n---\n"
              echo "$CHANGELOG"
            else
              echo "$CHANGELOG"
              echo -e "\n## Install\n\n\`\`\`bash\ncurl -fsSL https://raw.githubusercontent.com/efzynx/truckers-tool-linux/main/ttl.sh -o ttl.sh\nchmod +x ttl.sh\n./ttl.sh install\n./ttl.sh start\n\`\`\`\n"
              echo -e "## Update\n\n\`\`\`bash\n./ttl.sh update\n\`\`\`"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: ttl.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Notify Telegram
        if: steps.check_tag.outputs.exists == 'false'
        env:
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          # ambil hanya 20 baris pertama changelog
          SHORT_CHANGELOG=$(echo "$RELEASE_BODY" | awk '
          /^### (Added|Changed|Fixed|Removed)/ {flag=1}
          /^## / {flag=0}
          /^### / && !/^### (Added|Changed|Fixed|Removed)/ {flag=0}
          flag {print}
          ' | head -n 20)

          TEXT="🚀 NEW RELEASE

            🌿 Branch: ${{ github.ref_name }}
            🏷 Tag: ${{ steps.version.outputs.tag }}

            ━━━━━━━━━━━━━━━
            📋 CHANGELOG
            ━━━━━━━━━━━━━━━

            $SHORT_CHANGELOG

            📖 Baca changelog lengkap:
            https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md

            ━━━━━━━━━━━━━━━
            🔗 View Release
            https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"

          DATA=$(jq -n \
            --arg chat_id "${{ secrets.TELEGRAM_CHAT_ID }}" \
            --arg thread_id "${{ secrets.TELEGRAM_THREAD_ID }}" \
            --arg text "$TEXT" \
            '{
              chat_id: $chat_id,
              message_thread_id: ($thread_id | tonumber),
              text: $text
            }')

          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -H "Content-Type: application/json" \
            -d "$DATA"
      
  build-desktop:
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.exists == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: "🔍 Debug: Show release outputs"
        run: |
          echo "========================================="
          echo "  Release Job Outputs"
          echo "========================================="
          echo "Tag:        ${{ needs.release.outputs.tag }}"
          echo "Exists:     ${{ needs.release.outputs.exists }}"
          echo "Prerelease: ${{ needs.release.outputs.prerelease }}"
          echo "Version:    ${{ needs.release.outputs.version }}"
          echo "OS:         ${{ matrix.os }}"
          echo "========================================="

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        env:
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
          NEXT_PUBLIC_CLIENT_API_KEY: ${{ secrets.NEXT_PUBLIC_CLIENT_API_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api-ttl.efzyn.my.id/api/v1' }}
        run: npm run build:all && npx electron-builder --publish never

      - name: "🔍 Debug: List build output"
        shell: bash
        run: |
          echo "========================================="
          echo "  Build Output — release/ folder"
          echo "========================================="
          if [ -d "release" ]; then
            echo "✅ release/ folder exists"
            echo ""
            echo "--- All files ---"
            find release/ -type f -name "*.AppImage" -o -name "*.exe" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" | head -20
            echo ""
            echo "--- Full listing ---"
            ls -la release/ || true
          else
            echo "❌ release/ folder NOT found!"
            echo "--- Listing current directory ---"
            ls -la
          fi
          echo "========================================="

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release/*.AppImage
            release/*.exe
            release/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
