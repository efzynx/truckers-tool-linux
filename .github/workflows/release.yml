name: Auto Release

on:
  push:
    branches: [main, beta]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npx tsc --noEmit || true

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if pre-release (contains dash, e.g. 0.1.2-1, 0.2.0-beta.1)
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Pre-release detected: v$VERSION"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Stable release: v$VERSION"
          fi

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️ Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Tag $TAG does not exist, creating release."
          fi

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Generate release notes
        if: steps.check_tag.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"

          if [ "$PRERELEASE" = "true" ]; then
            TITLE="🧪 v${VERSION} — Pre-release (Beta)"
            BODY="⚠️ **This is a pre-release version for testing purposes.**\n\nInstall with:\n\`\`\`bash\n./ttl.sh update --beta\n\`\`\`\n\nTo go back to stable:\n\`\`\`bash\n./ttl.sh update\n\`\`\`"
          else
            TITLE="🚛 v${VERSION}"
            BODY="## What's New\n\nSee commit history for changes.\n\n## Install\n\n\`\`\`bash\ncurl -fsSL https://raw.githubusercontent.com/efzynx/truckers-tool-linux/main/ttl.sh -o ttl.sh\nchmod +x ttl.sh\n./ttl.sh install\n./ttl.sh start\n\`\`\`\n\n## Update\n\n\`\`\`bash\n./ttl.sh update\n\`\`\`"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          # Use heredoc for multiline body
          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: ttl.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
