appId: "com.efzyn.truckerstool"
productName: "Truckers Tool Linux"
artifactName: "${name}-${version}.${ext}"
directories:
  output: release
  buildResources: build
files:
  - "dist-electron/**/*"
  - "dist-server/**/*"
  - "out/**/*"
extraResources:
  - from: "settings.example.yml"
    to: "settings.yml"
  - from: "build/id.my.ttl.TruckersToolLinux.png"
    to: "build/id.my.ttl.TruckersToolLinux.png"
  - from: "build/id.my.ttl.TruckersToolLinux.svg"
    to: "build/id.my.ttl.TruckersToolLinux.svg"
win:
  target: 
    - nsis
    - portable
  icon: build/id.my.ttl.TruckersToolLinux.png
linux:
  target: 
    # - dir
    - pacman
    # - AppImage
    # - deb
    # - rpm
  category: Utility
  maintainer: "efzyn <me@efzyn.my.id>"
  icon: build/id.my.ttl.TruckersToolLinux.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
