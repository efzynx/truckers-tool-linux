appId: "com.efzyn.truckerstool"
productName: "Truckers Tool Linux"
artifactName: "${name}-${version}.${ext}"
directories:
  output: release
  buildResources: build
files:
  - "dist-electron/**/*"
  - "dist-server/**/*"
  - "out/**/*"
extraResources:
  - from: "settings.example.yml"
    to: "settings.yml"
win:
  target: 
    - nsis
    - portable
linux:
  target: AppImage
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
