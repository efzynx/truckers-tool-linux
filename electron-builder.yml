appId: "com.efzyn.truckerstool"
productName: "Truckers Tool Linux"
artifactName: "${name}-${version}.${ext}"
directories:
  output: release
  buildResources: build
files:
  - "dist-electron/**/*"
  - "dist-server/**/*"
  - "out/**/*"
extraResources:
  - from: "settings.example.yml"
    to: "settings.yml"
  - from: "build/icon.png"
    to: "build/icon.png"
win:
  target: 
    - nsis
    - portable
  icon: build/icon.ico
linux:
  target: 
    - pacman
    - AppImage
    - deb
    - rpm
  category: Utility
  maintainer: "efzyn <me@efzyn.my.id>"
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
